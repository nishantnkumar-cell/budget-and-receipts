name: BudgetReceipts
options:
  bundleIdPrefix: com.nishantkumar.budgetreceipts
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    # App Store Connect needs a higher build number on every upload. Scripts/testflight.command
    # passes a date-and-time build number; this one is only for local builds.
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Nishant Kumar's Apple Developer team. Tests and CI can still build unsigned with CODE_SIGNING_REQUIRED=NO.
    DEVELOPMENT_TEAM: VCWH3ZCZ5J
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Icon and colours come from Apple/Shared/Assets.xcassets, built by Design/logo/make_icons.py
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  BudgetCore:
    path: ../Core
targets:
  BudgetReceipts-iOS:
    type: application
    platform: iOS
    sources:
      - Shared
      - iOS
      - ShareExtension/SharedReceiptDrop.swift
      - Widgets/WidgetSnapshot.swift
      - Widgets/OpenScanIntent.swift
    dependencies:
      - package: BudgetCore
      - target: ShareExtension-iOS
      - target: Widgets-iOS
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Duo Budget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only Apple's own encryption (HTTPS, CloudKit, iCloud Keychain), which is exempt from export rules.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Duo Budget uses the camera to scan receipts and contract documents. Scans stay on your devices and in end-to-end encrypted iCloud.
        NSPhotoLibraryUsageDescription: Duo Budget reads the receipt photos you choose so it can read their text on this device.
        NSFaceIDUsageDescription: Duo Budget uses Face ID to unlock your budget.
        LSSupportsOpeningDocumentsInPlace: false
        # duobudget://scan, budgets, plan, ask: links from the widgets and the Control Centre button.
        CFBundleURLTypes:
          - CFBundleURLName: com.nishantkumar.budgetreceipts
            CFBundleURLSchemes: [duobudget]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Receipt
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, public.image]
          - CFBundleTypeName: Bank statement
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.comma-separated-values-text, com.intuit.ofx, com.intuit.qfx, com.intuit.qif]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.nishantkumar.budgetreceipts.backup
            UTTypeDescription: Duo Budget encrypted backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {public.filename-extension: [duobackup]}
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.intuit.ofx
            UTTypeDescription: OFX bank statement
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {public.filename-extension: [ofx]}
          - UTTypeIdentifier: com.intuit.qfx
            UTTypeDescription: QFX bank statement
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {public.filename-extension: [qfx]}
          - UTTypeIdentifier: com.intuit.qif
            UTTypeDescription: QIF bank statement
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {public.filename-extension: [qif]}
        CloudKitContainer: iCloud.com.nishantkumar.budgetreceipts
        CKSharingSupported: true
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.nishantkumar.budgetreceipts.sync]
    entitlements:
      path: iOS/BudgetReceipts.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nishantkumar.budgetreceipts]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.nishantkumar.budgetreceipts]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nishantkumar.budgetreceipts
        PRODUCT_MODULE_NAME: BudgetReceipts
        TARGETED_DEVICE_FAMILY: "1"
  BudgetReceipts-macOS:
    type: application
    platform: macOS
    sources:
      - Shared
      - macOS
      - ShareExtension/SharedReceiptDrop.swift
      - Widgets/WidgetSnapshot.swift
      - Widgets/OpenScanIntent.swift
    dependencies:
      - package: BudgetCore
      - target: ShareExtension-macOS
      - target: Widgets-macOS
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Duo Budget
        CFBundleName: Duo Budget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only Apple's own encryption (HTTPS, CloudKit, iCloud Keychain), which is exempt from export rules.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.finance
        # duobudget://scan, budgets, plan, ask: links from the widgets and the Control Centre button.
        CFBundleURLTypes:
          - CFBundleURLName: com.nishantkumar.budgetreceipts
            CFBundleURLSchemes: [duobudget]
        CloudKitContainer: iCloud.com.nishantkumar.budgetreceipts
        CKSharingSupported: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Receipt
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, public.image]
          - CFBundleTypeName: Bank statement
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.comma-separated-values-text, com.intuit.ofx, com.intuit.qfx, com.intuit.qif]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.nishantkumar.budgetreceipts.backup
            UTTypeDescription: Duo Budget encrypted backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {public.filename-extension: [duobackup]}
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.intuit.ofx
            UTTypeDescription: OFX bank statement
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {public.filename-extension: [ofx]}
          - UTTypeIdentifier: com.intuit.qfx
            UTTypeDescription: QFX bank statement
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {public.filename-extension: [qfx]}
          - UTTypeIdentifier: com.intuit.qif
            UTTypeDescription: QIF bank statement
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {public.filename-extension: [qif]}
    entitlements:
      path: macOS/BudgetReceipts.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Read-write so exports (CSV, PDF, encrypted backups) can be saved where you choose.
        com.apple.security.files.user-selected.read-write: true
        # On the Mac a team-prefixed group needs no provisioning profile.
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.nishantkumar.budgetreceipts]
        com.apple.security.network.client: true
        com.apple.developer.icloud-container-identifiers: [iCloud.com.nishantkumar.budgetreceipts]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nishantkumar.budgetreceipts
        PRODUCT_MODULE_NAME: BudgetReceipts
        ENABLE_HARDENED_RUNTIME: YES
  # "Duo Budget" in the share sheet: saves shared PDFs and images for the app to read.
  ShareExtension-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes: ["*.plist", "*.entitlements"]
    info:
      path: ShareExtension/Info-iOS.plist
      properties:
        CFBundleDisplayName: Duo Budget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
    entitlements:
      path: ShareExtension/ShareExtension-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nishantkumar.budgetreceipts]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nishantkumar.budgetreceipts.share
        TARGETED_DEVICE_FAMILY: "1"
  ShareExtension-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
        excludes: ["*.plist", "*.entitlements"]
    info:
      path: ShareExtension/Info-macOS.plist
      properties:
        CFBundleDisplayName: Duo Budget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
    entitlements:
      path: ShareExtension/ShareExtension-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.nishantkumar.budgetreceipts]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nishantkumar.budgetreceipts.share
        ENABLE_HARDENED_RUNTIME: YES
  # Safe to spend and Next bill widgets, and (iPhone) the Control Centre Scan Receipt button.
  Widgets-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: ["*.plist", "*.entitlements"]
      - ShareExtension/SharedReceiptDrop.swift
    info:
      path: Widgets/Info-iOS.plist
      properties:
        CFBundleDisplayName: Duo Budget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nishantkumar.budgetreceipts]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nishantkumar.budgetreceipts.widgets
        TARGETED_DEVICE_FAMILY: "1"
  Widgets-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets
        excludes: ["*.plist", "*.entitlements"]
      - ShareExtension/SharedReceiptDrop.swift
    info:
      path: Widgets/Info-macOS.plist
      properties:
        CFBundleDisplayName: Duo Budget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.nishantkumar.budgetreceipts]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nishantkumar.budgetreceipts.widgets
        ENABLE_HARDENED_RUNTIME: YES
  AppTests-iOS:
    type: bundle.unit-test
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BudgetReceipts-iOS
      - package: BudgetCore
  AppTests-macOS:
    type: bundle.unit-test
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: BudgetReceipts-macOS
      - package: BudgetCore
schemes:
  BudgetReceipts-iOS:
    build:
      targets:
        BudgetReceipts-iOS: all
    test:
      targets: [AppTests-iOS]
  BudgetReceipts-macOS:
    build:
      targets:
        BudgetReceipts-macOS: all
    test:
      targets: [AppTests-macOS]
